      position: absolute;
      top: 0;

    }

      0% {
        transform: translateX(-100%)
      }

      to {
        transform: translateX(100%)
      }
    }

    @media(min-width:640px) {
      .hero-skeleton {
        min-height: 650px
      }
    }

    .text-center {

    }

    .hidden {

    }

  <!-- FORCE CLEAR SERVICE WORKERS FOR DEV -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister().then(function(boolean) {
            if (boolean) {
              console.log('Unregistered old Service Worker to prevent Dev Server caching.');
              // Force reload after unregistering to fetch fresh index.html
              window.location.reload(true);
            }
          });
        }
      });
    }
  </script>
