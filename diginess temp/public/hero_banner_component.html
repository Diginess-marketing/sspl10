<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Banner Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#c40000',
                            text: '#ffffff',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-900 text-white m-0">

    <!-- Hero Banner Component Start -->
    <section class="relative w-full overflow-hidden bg-gray-900" aria-label="League Highlights and Promotions">

        <!-- Swiper Container (Structure Only) -->
        <div class="swiper-container w-full h-[600px] md:h-[700px] lg:h-[800px] relative group">

            <!-- Swiper Wrapper -->
            <div class="swiper-wrapper flex h-full w-full">

                <!-- Slide 1 -->
                <div class="swiper-slide relative w-full h-full flex-shrink-0">
                    <!-- Responsive Background Image -->
                    <div class="absolute inset-0 z-0">
                        <picture>
                            <source media="(min-width: 1280px)"
                                srcset="https://placehold.co/1920x800/1a1a1a/c40000?text=League+Finals+Desktop">
                            <source media="(min-width: 768px)"
                                srcset="https://placehold.co/1280x700/1a1a1a/c40000?text=League+Finals+Tablet">
                            <img src="https://placehold.co/800x600/1a1a1a/c40000?text=League+Finals+Mobile"
                                alt="Championship Finals 2026 - Stadium View"
                                class="w-full h-full object-cover object-center" loading="eager">
                        </picture>

                        <!-- Gradient Overlay for Text Readability -->
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-90 md:opacity-80">
                        </div>
                    </div>

                    <!-- Content Container -->
                    <div
                        class="relative z-10 w-full h-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-end pb-20 md:items-center md:pb-0">
                        <div class="w-full md:w-2/3 lg:w-1/2 space-y-6 md:space-y-8">

                            <!-- Tag -->
                            <span
                                class="inline-block px-4 py-1.5 rounded-full bg-brand-primary/90 text-white text-xs md:text-sm font-bold tracking-wider uppercase backdrop-blur-sm border border-brand-primary shadow-lg">
                                Season 2026
                            </span>

                            <!-- Main Heading -->
                            <h1
                                class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold leading-tight tracking-tight text-white drop-shadow-xl">
                                Unleash the <br class="hidden sm:block" />
                                <span class="text-brand-primary">Champion</span> Within
                            </h1>

                            <!-- Description -->
                            <p
                                class="text-lg md:text-xl text-gray-200 max-w-xl font-medium leading-relaxed drop-shadow-md">
                                Join the most prestigious tennis ball cricket league. Registration for the 2026 season
                                is now open for all zones.
                            </p>

                            <!-- Buttons -->
                            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                                <a href="#"
                                    class="inline-flex items-center justify-center px-8 py-4 text-base md:text-lg font-bold text-white bg-brand-primary rounded-lg transition-all duration-300 hover:bg-red-700 hover:shadow-[0_0_20px_rgba(196,0,0,0.6)] hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary focus:ring-offset-gray-900">
                                    Register Team
                                    <svg class="ml-2 -mr-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                                        aria-hidden="true">
                                        <path fill-rule="evenodd"
                                            d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                                            clip-rule="evenodd" />
                                    </svg>
                                </a>
                                <a href="#"
                                    class="inline-flex items-center justify-center px-8 py-4 text-base md:text-lg font-bold text-white border-2 border-white/30 bg-white/5 backdrop-blur-sm rounded-lg transition-all duration-300 hover:bg-white hover:text-black hover:border-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white focus:ring-offset-gray-900">
                                    View Usage Guide
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Additional swiper-slide placeholders would go here for a real carousel -->

            </div>

            <!-- Navigation Controls (Visual-only since no JS) -->
            <div class="hidden md:flex absolute top-1/2 -translate-y-1/2 left-4 z-20 w-12 h-12 items-center justify-center rounded-full bg-black/30 text-white backdrop-blur-md border border-white/10 hover:bg-brand-primary cursor-pointer transition-colors duration-200"
                aria-label="Previous Slide">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </div>
            <div class="hidden md:flex absolute top-1/2 -translate-y-1/2 right-4 z-20 w-12 h-12 items-center justify-center rounded-full bg-black/30 text-white backdrop-blur-md border border-white/10 hover:bg-brand-primary cursor-pointer transition-colors duration-200"
                aria-label="Next Slide">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </div>

            <!-- Pagination Container -->
            <div class="absolute bottom-6 left-0 right-0 z-20 flex justify-center gap-3">
                <span class="w-10 h-1 bg-brand-primary rounded-full shadow-sm cursor-pointer" aria-current="true"
                    aria-label="Go to slide 1"></span>
                <span class="w-2.5 h-1 bg-white/40 rounded-full hover:bg-white transition-colors cursor-pointer"
                    aria-label="Go to slide 2"></span>
                <span class="w-2.5 h-1 bg-white/40 rounded-full hover:bg-white transition-colors cursor-pointer"
                    aria-label="Go to slide 3"></span>
            </div>

        </div>
    </section>
    <!-- Hero Banner Component End -->

</body>

</html>
