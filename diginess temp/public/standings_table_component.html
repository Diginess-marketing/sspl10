<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings Table Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#c40000',
                            text: '#ffffff',
                            surface: '#111111',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50 font-sans text-gray-900">

    <!-- Standings Section Component Start -->
    <section class="py-12 bg-white" aria-labelledby="standings-heading">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-6 gap-4">
                <div>
                    <h2 id="standings-heading" class="text-2xl sm:text-3xl font-bold text-gray-900">Points Table</h2>
                    <p class="text-sm text-gray-500 mt-1">Season 2026 &middot; Group A</p>
                </div>
                <div class="flex items-center space-x-4 text-sm">
                    <div class="flex items-center">
                        <span class="w-3 h-3 rounded-sm bg-green-100 border border-green-300 mr-2"></span>
                        <span class="text-gray-600">Qualifier</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-3 h-3 rounded-sm bg-red-100 border border-red-300 mr-2"></span>
                        <span class="text-gray-600">Eliminated</span>
                    </div>
                </div>
            </div>

            <!-- Responsive Table Container -->
            <div class="overflow-hidden border border-gray-200 rounded-xl shadow-sm">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 whitespace-nowrap">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider sticky left-0 z-10 bg-gray-50 border-r border-gray-200 sm:border-none">
                                    Pos
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">
                                    Team
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider"
                                    title="Matches Played">
                                    M
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider"
                                    title="Won">
                                    W
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider"
                                    title="Lost">
                                    L
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider hidden sm:table-cell"
                                    title="Net Run Rate">
                                    NRR
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-bold text-gray-900 uppercase tracking-wider"
                                    title="Total Points">
                                    Pts
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider"
                                    title="Recent Form">
                                    Form
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">

                            <!-- Row 1: Qualified -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td
                                    class="px-6 py-4 whitespace-nowrap sticky left-0 z-10 bg-white border-r border-gray-100 sm:border-none">
                                    <div class="flex items-center">
                                        <span class="text-sm font-semibold text-gray-900 w-6">1</span>
                                        <div
                                            class="h-8 w-1 bg-green-500 rounded-r absolute left-0 top-1/2 -translate-y-1/2">
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div
                                            class="flex-shrink-0 h-8 w-8 rounded-full bg-yellow-100 flex items-center justify-center text-xs font-bold text-yellow-800 border border-yellow-200">
                                            SK
                                        </div>
                                        <div class="ml-4">
                                            <div class="text-sm font-bold text-gray-900">Super Kings</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    14
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium text-green-600">
                                    10
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    4
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500 hidden sm:table-cell">
                                    +1.240
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm font-bold text-gray-900 bg-gray-50/50">
                                    20
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center">
                                    <div class="flex items-center justify-center space-x-1">
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                    </div>
                                </td>
                            </tr>

                            <!-- Row 2: Qualified -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td
                                    class="px-6 py-4 whitespace-nowrap sticky left-0 z-10 bg-white border-r border-gray-100 sm:border-none">
                                    <div class="flex items-center">
                                        <span class="text-sm font-semibold text-gray-900 w-6">2</span>
                                        <div
                                            class="h-8 w-1 bg-green-500 rounded-r absolute left-0 top-1/2 -translate-y-1/2">
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div
                                            class="flex-shrink-0 h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-xs font-bold text-blue-800 border border-blue-200">
                                            MI
                                        </div>
                                        <div class="ml-4">
                                            <div class="text-sm font-bold text-gray-900">Mumbai Indians</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    14
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium text-green-600">
                                    9
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    5
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500 hidden sm:table-cell">
                                    +0.850
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm font-bold text-gray-900 bg-gray-50/50">
                                    18
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center">
                                    <div class="flex items-center justify-center space-x-1">
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                    </div>
                                </td>
                            </tr>

                            <!-- Row 3: Mid Table -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td
                                    class="px-6 py-4 whitespace-nowrap sticky left-0 z-10 bg-white border-r border-gray-100 sm:border-none">
                                    <span class="text-sm font-medium text-gray-500 pl-1">3</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div
                                            class="flex-shrink-0 h-8 w-8 rounded-full bg-purple-100 flex items-center justify-center text-xs font-bold text-purple-800 border border-purple-200">
                                            KKR
                                        </div>
                                        <div class="ml-4">
                                            <div class="text-sm font-medium text-gray-900">Knight Riders</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    14
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium text-green-600">
                                    7
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    7
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500 hidden sm:table-cell">
                                    -0.120
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm font-bold text-gray-900 bg-gray-50/50">
                                    14
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center">
                                    <div class="flex items-center justify-center space-x-1">
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-gray-300"
                                            title="No Result/Draw"></span>
                                    </div>
                                </td>
                            </tr>

                            <!-- Row 4: Eliminated -->
                            <tr class="hover:bg-red-50/30 transition-colors">
                                <td
                                    class="px-6 py-4 whitespace-nowrap sticky left-0 z-10 bg-white border-r border-gray-100 sm:border-none">
                                    <div class="flex items-center">
                                        <span class="text-sm font-medium text-gray-500 pl-1">4</span>
                                        <div
                                            class="h-8 w-1 bg-red-500 rounded-r absolute left-0 top-1/2 -translate-y-1/2">
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div
                                            class="flex-shrink-0 h-8 w-8 rounded-full bg-red-100 flex items-center justify-center text-xs font-bold text-red-800 border border-red-200">
                                            RCB
                                        </div>
                                        <div class="ml-4">
                                            <div class="text-sm font-medium text-gray-900">Royal Challengers</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    14
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium text-green-600">
                                    5
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                                    9
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500 hidden sm:table-cell">
                                    -0.550
                                </td>
                                <td
                                    class="px-6 py-4 whitespace-nowrap text-center text-sm font-bold text-gray-900 bg-gray-50/50">
                                    10
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-center">
                                    <div class="flex items-center justify-center space-x-1">
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                        <span class="block w-2 h-2 rounded-full bg-green-500" title="Win"></span>
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                        <span class="block w-2 h-2 rounded-full bg-red-500" title="Loss"></span>
                                    </div>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>

                <!-- Footer for mobile context -->
                <div
                    class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-xs text-gray-500 flex justify-between items-center sm:hidden">
                    <span>Swipe for NRR & Form &rarr;</span>
                </div>
            </div>

            <div class="mt-6 text-center">
                <a href="#" class="text-sm font-semibold text-brand-primary hover:text-red-700 transition-colors">
                    View Full Points Table
                </a>
            </div>

        </div>
    </section>
    <!-- Standings Section Component End -->

</body>

</html>
